; ShoulderCamVC
; GTA Vice City 1.0
;
; The default setup puts Tommy on the RIGHT side of the screen,
; matching the "other shoulder" you asked for.
;
; ShoulderOffset:
;   positive = Tommy appears on the RIGHT
;   negative = Tommy appears on the LEFT
;
; Recommended range: 0.45 - 0.80

[Camera]
Enabled=1
ShoulderOffset=0.65
HeightOffset=0.05

; 0 = keep GTA's current camera distance
Distance=0.0

; 0 = keep GTA's current FOV
FOV=0.0

AffectAiming=1
AffectVehicles=0
