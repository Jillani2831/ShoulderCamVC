name: Build ShoulderCamVC

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Download Plugin SDK
        shell: powershell
        run: |
          git clone --recurse-submodules https://github.com/DK22Pac/plugin-sdk.git "$env:GITHUB_WORKSPACE\plugin-sdk"
      
      - name: Check Plugin SDK
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\plugin-sdk"
      
          echo === Plugin SDK ===
          dir
      
          echo === RenderWare ===
          dir plugin_vc\game_vc\rw
      
          echo === Existing libraries ===
          if exist output\lib (
              dir output\lib
          ) else (
              echo output\lib does not exist yet
          )
      - name: Generate Plugin SDK project
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\plugin-sdk"
          set PLUGIN_SDK_DIR=%GITHUB_WORKSPACE%\plugin-sdk
          echo PLUGIN_SDK_DIR=%PLUGIN_SDK_DIR%
          call "tools\generate\Visual Studio.bat"
          
      - name: Check RenderWare files
        shell: cmd
        run: |
          echo Checking RenderWare directory...
          dir "%GITHUB_WORKSPACE%\plugin-sdk\plugin_vc\game_vc\rw"
      
          if not exist "%GITHUB_WORKSPACE%\plugin-sdk\plugin_vc\game_vc\rw" (
            echo ERROR: RenderWare directory is missing!
            exit /b 1
          )
      
          echo RenderWare directory FOUND.

      - name: Build Plugin SDK VC
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\plugin-sdk"
      
          msbuild plugin_vc\Plugin_VC.vcxproj ^
            /p:Configuration=zDebug ^
            /p:Platform=Win32 ^
            /p:OutDir=%GITHUB_WORKSPACE%\plugin-sdk\output\lib ^
            /p:IntDir=%GITHUB_WORKSPACE%\plugin-sdk\output\obj\Plugin_VC\Debug ^
            /m
      
      - name: Verify Plugin SDK library
        shell: cmd
        run: |
          echo === Plugin SDK output ===
          dir "%GITHUB_WORKSPACE%\plugin-sdk\output\lib"
      
          if not exist "%GITHUB_WORKSPACE%\plugin-sdk\output\lib\plugin_vc.lib" (
            echo.
            echo ERROR: plugin_vc.lib was NOT generated!
            exit /b 1
          )
      
          echo.
          echo SUCCESS: plugin_vc.lib FOUND!

      - name: Generate ShoulderCamVC project
        shell: cmd
        env:
          PLUGIN_SDK_DIR: ${{ github.workspace }}\plugin-sdk
        run: |
          cd /d "%GITHUB_WORKSPACE%"
          "%GITHUB_WORKSPACE%\plugin-sdk\tools\premake\premake5.exe" vs2022

      - name: Build ShoulderCamVC
        shell: cmd
        env:
          PLUGIN_SDK_DIR: ${{ github.workspace }}\plugin-sdk
        run: |
          cd /d "%GITHUB_WORKSPACE%"
      
          msbuild project_files\ShoulderCamVC.sln ^
            /p:Configuration=ReleaseVC ^
            /p:Platform=Win32 ^
            /m
      - name: Locate ASI
        shell: powershell
        run: |
          Get-ChildItem -Path "$env:GITHUB_WORKSPACE" -Filter "ShoulderCamVC.asi" -Recurse | Format-Table FullName,Length

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: ShoulderCamVC
          path: |
            **/ShoulderCamVC.asi
            ShoulderCamVC.ini
